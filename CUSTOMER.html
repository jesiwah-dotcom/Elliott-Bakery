<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Customer Account - Elliott's Bakery</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- =========================
         NAVIGATION
    ========================== -->

    <header>

        <nav class="nav-bar">

            <a href="index.html" class="logo">
                🧁 Elliott's Bakery
            </a>

            <button
                class="menu-btn"
                onclick="toggleMenu()"
                aria-label="Open navigation menu"
            >
                ☰
            </button>

            <ul class="nav-links" id="navLinks">

                <li>
                    <a href="index.html">
                        Home
                    </a>
                </li>

                <li>
                    <a href="index.html#services">
                        Services
                    </a>
                </li>

                <li>
                    <a href="index.html#contact">
                        Contact
                    </a>
                </li>

            </ul>

        </nav>

    </header>


    <!-- =========================
         CUSTOMER REGISTRATION
    ========================== -->

    <main>

        <section class="account-page">

            <div class="account-form-container">

                <div class="customer-form-icon">
                    👤
                </div>

                <h1>
                    Create Customer Account
                </h1>

                <p>
                    Sign up to order pastries, make
                    reservations and create custom designs.
                </p>


                <form id="customerForm">

                    <!-- Full Name -->

                    <div class="form-group">

                        <label for="customerName">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="customerName"
                            name="customerName"
                            placeholder="Enter your full name"
                            required
                        >

                    </div>


                    <!-- Email -->

                    <div class="form-group">

                        <label for="customerEmail">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="customerEmail"
                            name="customerEmail"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <!-- Phone -->

                    <div class="form-group">

                        <label for="customerPhone">
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            id="customerPhone"
                            name="customerPhone"
                            placeholder="Enter your phone number"
                            required
                        >

                    </div>


                    <!-- Password -->

                    <div class="form-group">

                        <label for="customerPassword">
                            Password
                        </label>

                        <input
                            type="password"
                            id="customerPassword"
                            name="customerPassword"
                            placeholder="Create a password"
                            minlength="8"
                            required
                        >

                    </div>


                    <!-- Location -->

                    <div class="form-group">

                        <label for="customerLocation">
                            Location
                        </label>

                        <input
                            type="text"
                            id="customerLocation"
                            name="customerLocation"
                            placeholder="Enter your location"
                            required
                        >

                    </div>


                    <!-- Submit -->

                    <button
                        type="submit"
                        class="account-submit"
                    >
                        Create Account
                    </button>
					

                </form>


                <p class="form-footer">

                    Or are you a baker?

                    <a href="BAKERY.html">
                        Register your bakery
                    </a>

                </p>

            </div>

        </section>

    </main>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer>

        <p>
            © Elliott's Bakery 2026.
            All rights reserved.
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
